name: Firebase
on:
  push:
    branches:
      - main
    paths:
      - apps/functions/**
      - .github/workflows/firebase.yaml

jobs:
  publish:
    name: Deploy Firebase functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Enable pnpm (corepack)
        run: corepack enable

      # The functions runtime stays on Node 18 (see apps/functions/package.json).
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: pnpm

      - name: Setup Credentials
        run: |
          echo $FIREBASE_SERVICE_ACCOUNT_GUPTASIDDHANT_COM > $HOME/firebase-cred.json;
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-cred.json";

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter gs-functions...

      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --only functions --token "$FIREBASE_TOKEN"
