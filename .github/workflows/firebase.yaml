name: Firebase
on:
  push:
    branches:
      - main
    paths:
      - apps/functions/**
      - .github/workflows/firebase.yaml

jobs:
  publish:
    name: Deploy Firebase functions
    runs-on: ubuntu-latest    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      # NOTE: This step is currently a no-op. FIREBASE_SERVICE_ACCOUNT_GUPTASIDDHANT_COM
      # is not mapped from secrets, so the file it writes is empty. The deploy relies
      # on FIREBASE_TOKEN (see "Deploy to Firebase" below), not on this credentials file.
      - name: Setup Credentials
        run: |
          echo $FIREBASE_SERVICE_ACCOUNT_GUPTASIDDHANT_COM > $HOME/firebase-cred.json;
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-cred.json";

      - name: Install dependencies
        run: yarn workspaces focus gs-functions

      # - name: Install firebase tools
      #   run: npm install --location=global firebase-tools

      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase deploy --only functions --token "$FIREBASE_TOKEN"
