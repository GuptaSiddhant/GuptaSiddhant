name: "Test"
on:
  push:
    branches:
      - main
    paths:
      - apps/remix/**
      - .github/workflows/test.yaml

jobs:
  publish:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter gs-remix...

      - name: Run tests
        run: pnpm --filter gs-remix test:coverage
