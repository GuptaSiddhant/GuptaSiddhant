name: Deploy Firebase rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - storage.rules
      - firestore.indexes.json
      - firebase.json
      - .github/workflows/firebase-rules.yaml
  workflow_dispatch:

concurrency:
  group: firebase-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # setup-node v5 auto-caches the packageManager (pnpm), which isn't installed in this job
          package-manager-cache: false
      - name: Write service account
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GUPTASIDDHANT_COM }}
        run: |
          test -n "$SA_JSON" || { echo "FIREBASE_SERVICE_ACCOUNT_GUPTASIDDHANT_COM secret is empty"; exit 1; }
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Deploy Firestore and Storage rules
        run: npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes,storage --project guptasiddhant-com --non-interactive
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
